[package]
name = "sverilogparse"
version = "0.4.3"
edition = "2024"
description = "Verilog netlist (structural verilog) parser"
license = "Apache-2.0"
authors = ["Zizheng Guo <gzz_2000@126.com>"]
repository = "https://github.com/verion-eda/sverilogparse"

[dependencies]
awint = "0.17.0"
compact_str = "0.7.1"
indenter = "0.3.3"
itertools = "0.10.3"
lazy_static = "1.4.0"
nom = "7.1.3"
regex = "1.6.0"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"

[lints.clippy]
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
redundant_clone = "deny"
undocumented_unsafe_blocks = "deny"
